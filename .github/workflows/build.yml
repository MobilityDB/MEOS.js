name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The tree is checked before anything is built: the four rules read
  # `git ls-files` and nothing else, so a finding arrives in seconds rather than
  # after a catalog derivation. The rules live in MEOS-API beside the catalog and
  # the provisioning recipe, so this repository carries no copy of them to go
  # stale.
  hygiene:
    name: Tree hygiene
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Refuse tracked build output, skipped suites and stale pins
        uses: MobilityDB/MEOS-API/.github/actions/check-tree-hygiene@master

      # Reads the test SOURCES, so it needs neither node_modules nor the module,
      # and it answers the same locally through `npm run check:no-skips`. The
      # floor in the wasm job catches a skip once the suite has RUN; this catches
      # one as it is written.
      - name: Refuse a construct that stops a test asserting
        run: node tools/check-no-skips.mjs

  generate-and-typecheck:
    name: Regenerate from the catalog and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The catalog is derived here rather than read from the tree. The Dockerfile
      # clones MobilityDB at master, so a committed catalog names a different commit
      # than the library the module links against; deriving both from master is what
      # keeps the surface the generator projects and the surface the build links
      # against the same one.
      - name: Provision MEOS (catalog)
        id: provision
        uses: MobilityDB/MEOS-API/.github/actions/provision-meos@master
        with:
          mobilitydb-ref: master

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Stage the derived catalog for the generator
        run: cp "${{ steps.provision.outputs.catalog-path }}" codegen/res/meos-idl.json

      # This also runs the generator's own assertion that every emitted wrapper
      # consults the MEOS error state, which otherwise only fires when somebody
      # regenerates locally.
      - name: Regenerate the bindings
        run: npm run generate

      - name: Report drift between the committed and freshly derived sources
        run: |
          # Informational, and deliberately so: MobilityDB master moves independently
          # of this repository, so a difference between the committed projection and a
          # freshly derived one is ordinary and a contributor cannot act on it.
          # Refresh it by running the chain and committing the result.
          if ! git diff --quiet -- core/functions/functions.generated.ts core/c-src/bindings.c; then
            echo "::notice::the committed sources differ from the freshly derived catalog (snapshot lags MobilityDB master):"
            git diff --stat -- core/functions/functions.generated.ts core/c-src/bindings.c
          else
            echo "the committed sources are in sync with the derived catalog."
          fi

      - name: Type-check
        run: npx tsc --noEmit

  wasm:
    name: Build the WebAssembly module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The MEOS the module embeds comes from a clone of MobilityDB master made
      # inside the image, so the clone layer must not be served from the cache:
      # a cached mobilitydb_src freezes MEOS at whatever commit first populated
      # it, and the module would then be built against a MEOS nobody is running.
      # The dependency stages (sqlite, geos, proj, json-c, gsl, h3, zlib,
      # libxml2, gdal) are pure builds of pinned releases, so they cache safely
      # and carry the cost of this job.
      - name: Build the WebAssembly module
        uses: docker/build-push-action@v6
        with:
          context: .
          target: wasm
          outputs: type=local,dest=./wasm
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache-filters: mobilitydb_src

      - name: Report what the module carries
        run: |
          ls -la wasm/meos.js wasm/meos.wasm

      # The suite runs HERE and nowhere else, because this is the only job that
      # holds the module. Every test imports `wasm/meos.js`, which the step above
      # takes out of the image, so a job without it can collect nothing — which is
      # why the suite went unrun while three jobs reported success.
      # Node 24, not the 20 the type-check job uses: `npm test` names its files
      # with `test/**/test_*.ts` and lets the test runner expand that glob, which
      # Node 20 does not do — it reports `Could not find '<the literal pattern>'`
      # and runs nothing. Nothing declares the requirement (`package.json` carries
      # no `engines`), and no job ran the suite, so the script has never worked on
      # the version the other job pins.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # `pipefail` is what makes the tee honest: without it the step's status is
      # tee's, so a suite that FAILED would report success and the guard below
      # would read a log nobody was failing on.
      - name: Run the suite
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log
