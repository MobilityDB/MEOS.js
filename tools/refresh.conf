# refresh.conf — MEOS.js's last leg for tools/refresh-binding.sh (in MEOS-API).
# codegen/FunctionsGenerator.ts reads the INSTALLED catalog (FFI-accurate struct layouts +
# the internal functions the WASM libmeos.a exports) staged at CATALOG_DEST, and rewrites the
# committed core/c-src/bindings.c and core/functions/functions.generated.ts. The WASM libmeos
# is compiled separately (wasm/, emscripten); this leg re-derives the generated TS + C shim.
ENGINE=js
BUILD_DIR=.
BUILD_LIBMEOS=true
CATALOG_DEST=codegen/res/meos-idl.json
BUILD_CMD='npm ci --no-audit --no-fund
  npm run generate'
